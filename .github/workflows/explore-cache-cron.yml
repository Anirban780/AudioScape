name: AudioScape Maintenance & Cache Pre-warming Cron

on:
  schedule:
    # Runs daily at 03:00 UTC (during low traffic hours)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual trigger via GitHub Actions UI with target environment selection
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - production
          - staging

permissions: {}

jobs:
  maintenance-cron:
    name: Execute Platform Maintenance & Pre-warming
    runs-on: ubuntu-latest

    steps:
      - name: Assert Required Secrets
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET secret is missing in GitHub Repository Secrets!"
            exit 1
          fi

      - name: Determine Environments to Run
        id: envs
        run: |
          TARGET="${{ inputs.target_env || 'all' }}"
          if [ "$TARGET" = "all" ]; then
            echo "TARGETS=production staging" >> $GITHUB_OUTPUT
          elif [ "$TARGET" = "staging" ]; then
            echo "TARGETS=staging" >> $GITHUB_OUTPUT
          else
            echo "TARGETS=production" >> $GITHUB_OUTPUT
          fi

      - name: 1. Pre-warm Explore Categories Cache
        run: |
          for ENV in ${{ steps.envs.outputs.TARGETS }}; do
            echo "================================================================="
            echo "🔄 Pre-warming Explore Categories Cache for [${ENV}]..."
            echo "================================================================="

            if [ "$ENV" = "staging" ]; then
              BACKEND_URL="${{ secrets.STAGING_BACKEND_URL || 'https://audioscape-api-staging.onrender.com' }}"
            else
              BACKEND_URL="${{ secrets.BACKEND_URL || 'https://audioscape-api.onrender.com' }}"
            fi

            echo "Target Backend API: ${BACKEND_URL}"

            # Pre-flight healthcheck with 15s timeout
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${BACKEND_URL}/healthcheck" || true)
            echo "Healthcheck HTTP Status: ${HEALTH_STATUS}"

            if [ "$HEALTH_STATUS" != "200" ]; then
              if [ "$ENV" = "staging" ]; then
                echo "::warning::Staging backend at ${BACKEND_URL} returned status ${HEALTH_STATUS} (service may be paused or unprovisioned). Skipping staging."
                continue
              else
                echo "::error::Production backend at ${BACKEND_URL} healthcheck failed with status ${HEALTH_STATUS}"
                exit 1
              fi
            fi

            HTTP_STATUS=$(curl -s -o response_explore.json -w "%{http_code}" \
              -X POST "${BACKEND_URL}/api/music/cron/refresh-explore-cache" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json")

            echo "Response HTTP Status: ${HTTP_STATUS}"
            cat response_explore.json
            echo ""

            if [ "${HTTP_STATUS}" -ne 200 ] && [ "${HTTP_STATUS}" -ne 201 ]; then
              if [ "$ENV" = "staging" ]; then
                echo "::warning::Staging Explore Cache pre-warming returned HTTP status ${HTTP_STATUS}"
              else
                echo "::error::Production Explore Cache pre-warming failed with HTTP status ${HTTP_STATUS}"
                exit 1
              fi
            else
              echo "✅ Explore Cache pre-warming succeeded for ${ENV}."
            fi
          done

      - name: 2. YouTube ToS 30-Day Stale Track Refresh & Soft-Delete
        run: |
          for ENV in ${{ steps.envs.outputs.TARGETS }}; do
            echo "================================================================="
            echo "🔄 Refreshing YouTube ToS Stale Tracks for [${ENV}]..."
            echo "================================================================="

            if [ "$ENV" = "staging" ]; then
              BACKEND_URL="${{ secrets.STAGING_BACKEND_URL || 'https://audioscape-api-staging.onrender.com' }}"
            else
              BACKEND_URL="${{ secrets.BACKEND_URL || 'https://audioscape-api.onrender.com' }}"
            fi

            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${BACKEND_URL}/healthcheck" || true)
            if [ "$HEALTH_STATUS" != "200" ]; then
              if [ "$ENV" = "staging" ]; then
                echo "::warning::Staging backend is unavailable. Skipping stale track refresh."
                continue
              else
                echo "::error::Production backend is unavailable."
                exit 1
              fi
            fi

            HTTP_STATUS=$(curl -s -o response_stale.json -w "%{http_code}" \
              -X POST "${BACKEND_URL}/youtube/cron/refresh-stale-tracks" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json")

            echo "Response HTTP Status: ${HTTP_STATUS}"
            cat response_stale.json
            echo ""

            if [ "${HTTP_STATUS}" -ne 200 ] && [ "${HTTP_STATUS}" -ne 201 ]; then
              if [ "$ENV" = "staging" ]; then
                echo "::warning::Staging YouTube ToS Stale Track Refresh returned HTTP status ${HTTP_STATUS}"
              else
                echo "::error::Production YouTube ToS Stale Track Refresh failed with HTTP status ${HTTP_STATUS}"
                exit 1
              fi
            else
              echo "✅ Stale track refresh succeeded for ${ENV}."
            fi
          done

      - name: 3. Search Cache Garbage Collection & Orphan Track Sweep
        run: |
          for ENV in ${{ steps.envs.outputs.TARGETS }}; do
            echo "================================================================="
            echo "🧹 Running Search Cache GC for [${ENV}]..."
            echo "================================================================="

            if [ "$ENV" = "staging" ]; then
              BACKEND_URL="${{ secrets.STAGING_BACKEND_URL || 'https://audioscape-api-staging.onrender.com' }}"
            else
              BACKEND_URL="${{ secrets.BACKEND_URL || 'https://audioscape-api.onrender.com' }}"
            fi

            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "${BACKEND_URL}/healthcheck" || true)
            if [ "$HEALTH_STATUS" != "200" ]; then
              if [ "$ENV" = "staging" ]; then
                echo "::warning::Staging backend is unavailable. Skipping Search Cache GC."
                continue
              else
                echo "::error::Production backend is unavailable."
                exit 1
              fi
            fi

            HTTP_STATUS=$(curl -s -o response_gc.json -w "%{http_code}" \
              -X POST "${BACKEND_URL}/youtube/cron/gc-search-cache?graceDays=3&orphanDays=30" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json")

            echo "Response HTTP Status: ${HTTP_STATUS}"
            cat response_gc.json
            echo ""

            if [ "${HTTP_STATUS}" -ne 200 ] && [ "${HTTP_STATUS}" -ne 201 ]; then
              if [ "$ENV" = "staging" ]; then
                echo "::warning::Staging Search Cache GC returned HTTP status ${HTTP_STATUS}"
              else
                echo "::error::Production Search Cache GC failed with HTTP status ${HTTP_STATUS}"
                exit 1
              fi
            else
              echo "✅ Search Cache GC succeeded for ${ENV}."
            fi
          done
