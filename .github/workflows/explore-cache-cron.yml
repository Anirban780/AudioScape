name: AudioScape Maintenance & Cache Pre-warming Cron

on:
  schedule:
    # Runs daily at 03:00 UTC (during low traffic hours)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual trigger via GitHub Actions UI with target environment selection
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  maintenance-cron:
    name: Execute Platform Maintenance & Pre-warming
    runs-on: ubuntu-latest

    steps:
      - name: Assert Required Secrets
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET secret is missing in GitHub Repository Secrets!"
            exit 1
          fi

      - name: 1. Pre-warm Explore Categories Cache
        run: |
          TARGET="${{ inputs.target_env || 'production' }}"
          if [ "$TARGET" = "staging" ]; then
            BACKEND_URL="${{ secrets.STAGING_BACKEND_URL || 'https://audioscape-staging.vercel.app' }}"
          else
            BACKEND_URL="${{ secrets.BACKEND_URL || 'https://audio-scape-pi.vercel.app' }}"
          fi
          echo "Triggering Explore Cache Pre-warming on ${BACKEND_URL} (${TARGET})..."
          
          HTTP_STATUS=$(curl -s -o response_explore.json -w "%{http_code}" \
            -X POST "${BACKEND_URL}/api/music/cron/refresh-explore-cache" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "Response HTTP Status: ${HTTP_STATUS}"
          cat response_explore.json
          echo ""

          if [ "${HTTP_STATUS}" -ne 200 ] && [ "${HTTP_STATUS}" -ne 201 ]; then
            echo "::error::Explore Cache pre-warming failed with HTTP status ${HTTP_STATUS}"
            exit 1
          fi

      - name: 2. YouTube ToS 30-Day Stale Track Refresh & Soft-Delete
        run: |
          TARGET="${{ inputs.target_env || 'production' }}"
          if [ "$TARGET" = "staging" ]; then
            BACKEND_URL="${{ secrets.STAGING_BACKEND_URL || 'https://audioscape-staging.vercel.app' }}"
          else
            BACKEND_URL="${{ secrets.BACKEND_URL || 'https://audio-scape-pi.vercel.app' }}"
          fi
          echo "Triggering YouTube ToS 30-day Metadata Refresh on ${BACKEND_URL} (${TARGET})..."
          
          HTTP_STATUS=$(curl -s -o response_stale.json -w "%{http_code}" \
            -X POST "${BACKEND_URL}/youtube/cron/refresh-stale-tracks" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "Response HTTP Status: ${HTTP_STATUS}"
          cat response_stale.json
          echo ""

          if [ "${HTTP_STATUS}" -ne 200 ] && [ "${HTTP_STATUS}" -ne 201 ]; then
            echo "::error::YouTube ToS Stale Track Refresh failed with HTTP status ${HTTP_STATUS}"
            exit 1
          fi

      - name: 3. Search Cache Garbage Collection & Orphan Track Sweep
        run: |
          TARGET="${{ inputs.target_env || 'production' }}"
          if [ "$TARGET" = "staging" ]; then
            BACKEND_URL="${{ secrets.STAGING_BACKEND_URL || 'https://audioscape-staging.vercel.app' }}"
          else
            BACKEND_URL="${{ secrets.BACKEND_URL || 'https://audio-scape-pi.vercel.app' }}"
          fi
          echo "Triggering Search Cache GC on ${BACKEND_URL} (${TARGET})..."
          
          HTTP_STATUS=$(curl -s -o response_gc.json -w "%{http_code}" \
            -X POST "${BACKEND_URL}/youtube/cron/gc-search-cache?graceDays=3&orphanDays=30" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "Response HTTP Status: ${HTTP_STATUS}"
          cat response_gc.json
          echo ""

          if [ "${HTTP_STATUS}" -ne 200 ] && [ "${HTTP_STATUS}" -ne 201 ]; then
            echo "::error::Search Cache GC failed with HTTP status ${HTTP_STATUS}"
            exit 1
          fi
