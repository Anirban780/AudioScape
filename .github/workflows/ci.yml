name: CI Build & Test Check

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

jobs:
  frontend-check:
    name: Frontend (Vite + React) Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: rm -f package-lock.json && npm install

      - name: Run Frontend Tests (Vitest)
        run: npx vitest run --passWithNoTests

      - name: Build Frontend
        run: npm run build

  backend-check:
    name: Backend (NestJS + Prisma) Build & Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/audioscape?schema=public"
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: rm -f package-lock.json && npm install

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Typecheck Backend (TypeScript)
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Backend Tests (Jest)
        working-directory: ./backend
        run: npx jest --passWithNoTests

  docker-check:
    name: Docker Images Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t audioscape-frontend:latest -f Dockerfile .

      - name: Build Backend Docker Image
        run: docker build -t audioscape-backend:latest -f backend/Dockerfile ./backend