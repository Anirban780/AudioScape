name: CI Build & Test Check

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

jobs:
  frontend-check:
    name: Frontend (Vite + React) Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Frontend Tests (Vitest)
        run: npx vitest run --passWithNoTests

      - name: Build Frontend
        run: npm run build

  backend-check:
    name: Backend (NestJS + Prisma) Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Typecheck Backend (TypeScript)
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Run Backend Tests (Jest)
        working-directory: ./backend
        run: npx jest --passWithNoTests